version: 1

table: olist_sellers_dataset
description: >
  One row per seller. This table holds the directory of sellers on the Olist marketplace,
  including their location details such as city, state, and zip code.
business_context: >
  Use this table to analyze seller distribution across different regions or to
  join with sales data for regional sales performance analysis. Common joins
  include linking seller information to sales or order datasets for comprehensive
  marketplace insights.

# Columns
columns:
  - name: seller_id
    type: VARCHAR
    description: Unique identifier for each seller in the Olist marketplace.
    sample_values:
      - "09bad886111255c5b5030314fc7f1a4a"
      - "be9a160a9011f627c3e121d076c1ec7b"

  - name: seller_zip_code_prefix
    type: INT
    description: Zip code prefix of the seller's location.
    sample_values:
      - "2118"
      - "23080"

  - name: seller_city
    type: VARCHAR
    description: City where the seller is located.
    sample_values:
      - "jau"
      - "angra dos reis"

  - name: seller_state
    type: VARCHAR
    description: State where the seller is located, represented by its abbreviation.
    sample_values:
      - "RN"
      - "PA"

# Joins
joins:
  - to: olist_geolocation_dataset
    type: LEFT
    condition: "olist_sellers_dataset.seller_zip_code_prefix = olist_geolocation_dataset.zip_code_prefix"
    cardinality: one_to_many

  - to: olist_order_items_dataset
    type: LEFT
    condition: "olist_sellers_dataset.seller_id = olist_order_items_dataset.seller_id"
    cardinality: one_to_many

# Metrics
metrics:
  - name: total_sellers
    description: Total number of unique sellers in the Olist marketplace.
    sql: "COUNT(DISTINCT seller_id)"